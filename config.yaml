# SmartDesk AI configuration (FR-H16). No secrets here; those live in .env.
# Changing a model ID below is the only change needed to swap models.
# Prices are USD per 1M tokens (SPEC section 2, checked 2026-10-12; re-check before final runs).

models:
  main:                      # Main-Model tier
    id: gpt-5.4-mini
    context_window: 400000
    max_output: 128000
    reasoning_effort: none   # verified in the T0.9 spike
    price: {input: 0.75, cached_input: 0.075, output: 4.50}
  light:                     # Light-Model tier
    id: gpt-4o-mini
    context_window: 128000
    max_output: 16384
    price: {input: 0.15, cached_input: 0.075, output: 0.60}
  embedding:
    id: text-embedding-3-small
    price: {input: 0.02}
  reranker:                  # local cross-encoder (FR-A6), no per-token price
    id: BAAI/bge-reranker-base

# Task-to-tier map (FR-H17). Budget cutoff 1 and outage fallback override it.
tiers:
  ORCHESTRATOR: main         # intent classification, decomposition, query rewriting
  WORKER_ANSWER: main        # IT and HR worker answers (RAG)
  SYNTHESIZER: main
  GROUNDING_JUDGE: main      # FR-H2
  TOOL_SELECT: light         # tool selection and argument filling
  TICKET_DRAFT: light        # ticket summary drafting
  INJECTION_CLASSIFIER: light
  COMPACTION: light          # context compaction summary
  CONFIRM_PARSE: light       # yes / no / edit at the ticket gate (FR-G12)
  CHITCHAT: light            # small talk, deflection, clarifying questions

# Reasoning effort per task, Main tier only; a task not listed uses models.main.reasoning_effort.
reasoning_effort:
  GROUNDING_JUDGE: low       # the judge at "none" rejected claims that are in the context (live gap run 3)

# LLM call retry (FR-F2): attempts per model before the outage fallback, doubling backoff.
llm:
  retry_attempts: 3
  backoff_seconds: 0.5

# Tool executor retry (FR-G4): at most this many total attempts, transient failures only.
tools:
  max_attempts: 3
  backoff_seconds: 0.2

# Which implementation sits behind each external interface (FR-B10). tickets: mock keeps
# everything in memory and never calls GitHub; live needs GITHUB_TOKEN and TICKETS_REPO.
# llm: mock uses scripted offline models and hashing embeddings (CLI and tests run with no keys);
# live uses OpenAI and needs OPENAI_API_KEY and an index built by the ingest script.
modes:
  tickets: mock
  llm: mock

# GitHub REST client for the tickets repo (FR-B12). Pagination size is capped at 100 by GitHub.
github:
  api_base_url: https://api.github.com
  api_version: "2022-11-28"
  timeout_seconds: 10
  per_page: 100

# Daily spend (FR-H8). cutoff_1: everything moves to Light-Model.
# cutoff_2: total daily spend at which service stops (a further $5 after cutoff_1).
budget:
  timezone: America/New_York
  cutoff_1_usd: 5.0
  cutoff_2_usd: 10.0
  eval_bypass: false         # true lets Ragas runs ignore the daily cutoff

# Rolling window per session (FR-H13). Three independent counters.
rate_limits:
  window_seconds: 3600
  questions: 100
  ticket_creations: 40
  ticket_lookups: 40
  bypass: false              # evals and tests only

# Compaction triggers at this share of the active model's context window (FR-H5).
compaction:
  trigger_fraction: 0.75
  keep_last_turns: 4         # the last few employee turns (and their replies) are never summarized

# Status list (FR-C3): at most this many tickets are listed, newest first, then "and N older ones".
status:
  max_listed: 10

input:
  max_chars: 4000            # FR-F4

thresholds:
  escalation: 0.40           # provisional until the live re-check; run 2 at 0.45 gave KB answered 71.7% / gap pass 100%; replay at 0.40 gives 79.2% / 100% (needs a live re-check)
  escalation_mock: 0.10      # mock mode only (hashing embeddings are weaker); the mock answer model judges sufficiency
  routing_confidence: 0.60   # provisional, tuned in T4.4 (FR-D8)
  semantic_cache_cutoff: 0.95  # provisional, tuned in T6.10 (high cut-off, cache rules)
  duplicate_title: 0.72      # tuned offline on 60 title pairs (best F1); see evals/results/duplicate_threshold.json
  injection_heuristic: 0.30  # provisional, tuned in T5.4 (LLM classifier runs only above this, FR-H1)

# Input and output guardrails (FR-H1, FR-H2).
guardrails:
  pii_min_score: 0.5         # Presidio hits below this confidence are ignored
  moderation_model: omni-moderation-latest   # OpenAI Moderation API (free); check the ID before live use

# Hybrid retrieval (SPEC section 2, FR-A6): top-k from each retriever, RRF constant,
# entries kept after rerank and collapse by entry_id.
retrieval:
  strategy: hybrid_rerank   # hybrid_rerank (FR-A6 default) | dense | hybrid | dense_rerank, same names as the ablation (FR-A7)
  k_each: 20
  rrf_k: 60
  top_n: 5

# One chunk = one KB entry; split only above split_above_tokens, with overlap (FR-A3).
chunking:
  target_min_tokens: 200
  target_max_tokens: 500
  split_above_tokens: 600
  overlap_pct: 15

# Active version per prompt (FR-H14): file agent/prompts/<name>_v<N>.md.
# Provisional, files arrive with their tasks (T0.4 loader, T4.x and T5.x prompts).
prompts:
  orchestrator: 3
  answer: 2
  synthesizer: 1
  grounding_judge: 2
  ticket_summary: 1
  tool_select: 1
  injection_classifier: 1
  compaction: 1
  confirm_parse: 2
  chitchat: 1
