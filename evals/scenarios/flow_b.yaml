id: flow_b
title: 'Flow B: monitor flickering, no guide, ticket offered, email asked, summary, confirmed, ID returned'
kind: flow
fr:
- FR-A16
- FR-B1
- FR-B4
- FR-B8
- FR-G12
setup: {}
turns:
- user: My monitor keeps flickering
  expect:
    step: ticket_offer_with_email_request
    intent: kb_query
    tool: search_kb
    awaiting_after: email
    ticket_created: false
- user: priya.k@smartdesk.example
  expect:
    step: ticket_summary
    intent: create_ticket
    summary_fields:
    - title
    - description
    - category
    - email
    ticket_created: false
- user: Yes, create it
  expect:
    step: ticket_created
    tool: create_ticket
    ticket_created: true
    ticket_id_in_reply: true
    ticket_link_in_reply: true
